[build-system]
# Pinned, so that a release is built with the build backend that was reviewed: change the version on purpose, in its
# own pull request. It builds with Python 3.10 or newer; the package itself runs on Python 3.8 or newer.
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "purebyte"
version = "1.0.0"
description = "Tiny byte-level AI models on your CPU: the PureByte runtime, CLI and Python bindings (example specialists for credentials and personal data)."
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE"]  # the repository's, copied here by setup.py when a wheel is built
authors = [{name = "Pablo Sirvent Jiménez", email = "pablo@purebyte.ai"}]
keywords = ["byte-level", "small-models", "state-space-models", "ternary", "cpu-inference", "on-device", "secrets", "pii", "redaction"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/purebyte-ai/purebyte"
Documentation = "https://github.com/purebyte-ai/purebyte/tree/main/docs"
Changelog = "https://github.com/purebyte-ai/purebyte/blob/main/CHANGELOG.md"
Issues = "https://github.com/purebyte-ai/purebyte/issues"

[project.scripts]
purebyte = "purebyte.__main__:main"

[tool.setuptools]
packages = ["purebyte"]
include-package-data = false

[tool.setuptools.package-data]
purebyte = ["py.typed", "_lib/*", "_data/*"]
